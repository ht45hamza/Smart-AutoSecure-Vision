<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Smart AutoSecure — Mobile Camera</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-glow: rgba(99,102,241,0.35);
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
    --bg: #070b14;
    --bg2: #0f1523;
    --card: #141b2d;
    --border: rgba(99,102,241,0.2);
    --text: #e2e8f0;
    --muted: #64748b;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }

  /* ── Layout ── */
  #app { display:flex; flex-direction:column; height:100dvh; position:relative; }

  /* ── Header ── */
  #header {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:var(--bg2);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(20px); flex-shrink:0; z-index:10;
  }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-icon {
    width:36px; height:36px; border-radius:10px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; box-shadow:0 0 18px var(--primary-glow);
  }
  .logo-text { font-size:13px; font-weight:700; letter-spacing:0.5px; }
  .logo-sub { font-size:10px; color:var(--muted); margin-top:1px; }

  /* ── Status pill ── */
  #status-pill {
    display:flex; align-items:center; gap:6px;
    padding:5px 12px; border-radius:50px; font-size:11px; font-weight:600;
    letter-spacing:0.5px; transition:all 0.4s ease;
    background:rgba(100,116,139,0.15); border:1px solid rgba(100,116,139,0.3);
    color:var(--muted);
  }
  #status-pill.connecting { background:rgba(245,158,11,0.15); border-color:rgba(245,158,11,0.3); color:var(--warning); }
  #status-pill.streaming  { background:rgba(34,197,94,0.15);  border-color:rgba(34,197,94,0.3);  color:var(--success); }
  #status-pill.error      { background:rgba(239,68,68,0.15);  border-color:rgba(239,68,68,0.3);  color:var(--danger); }
  .pulse-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .pulse-dot.animate { animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }

  /* ── Video area ── */
  #video-wrap {
    flex:1; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  #cam-video {
    width:100%; height:100%;
    object-fit:cover;
    transform:scaleX(-1); /* mirror front cam */
    display:none;
  }
  #cam-video.environment { transform:none; } /* don't mirror rear cam */

  /* ── Overlay HUD ── */
  #hud {
    position:absolute; inset:0; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:16px;
  }
  .corner-tl, .corner-tr, .corner-bl, .corner-br {
    position:absolute; width:24px; height:24px;
    border-color:#6366f1; border-style:solid;
    opacity:0.7;
  }
  .corner-tl { top:16px; left:16px; border-width:2px 0 0 2px; border-radius:4px 0 0 0; }
  .corner-tr { top:16px; right:16px; border-width:2px 2px 0 0; border-radius:0 4px 0 0; }
  .corner-bl { bottom:100px; left:16px; border-width:0 0 2px 2px; border-radius:0 0 0 4px; }
  .corner-br { bottom:100px; right:16px; border-width:0 2px 2px 0; border-radius:0 0 4px 0; }

  /* scan line */
  #scan-line {
    position:absolute; left:16px; right:16px; height:2px;
    background:linear-gradient(90deg,transparent,#6366f1,transparent);
    opacity:0; animation:scan 2.5s ease-in-out infinite;
    box-shadow:0 0 12px #6366f1;
  }
  @keyframes scan {
    0%   { top:16px; opacity:0; }
    10%  { opacity:1; }
    90%  { opacity:1; }
    100% { top:calc(100% - 100px); opacity:0; }
  }

  /* stats bar */
  #stats-bar {
    display:flex; justify-content:center; gap:20px; margin-top:auto;
    padding-top:8px;
  }
  .stat-chip {
    display:flex; flex-direction:column; align-items:center;
    background:rgba(0,0,0,0.55); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.08); border-radius:12px;
    padding:6px 14px; min-width:60px;
  }
  .stat-val { font-size:15px; font-weight:700; color:#e2e8f0; }
  .stat-lbl { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }

  /* ── Bottom controls ── */
  #controls {
    padding:16px; background:var(--bg2);
    border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-shrink:0;
  }
  .ctrl-btn {
    border:none; cursor:pointer; border-radius:16px;
    font-size:12px; font-weight:600; letter-spacing:0.5px;
    display:flex; align-items:center; gap:7px;
    padding:12px 18px; transition:all 0.2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #btn-start {
    flex:1; background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:white; font-size:14px; padding:14px;
    box-shadow:0 4px 20px var(--primary-glow);
    border-radius:16px;
  }
  #btn-start:active { transform:scale(0.97); }
  #btn-start:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  #btn-flip {
    background:rgba(99,102,241,0.12); border:1px solid var(--border);
    color:var(--text); font-size:22px; padding:12px 16px;
    border-radius:16px;
  }
  #btn-flip:active { transform:scale(0.93); }
  #btn-stop {
    background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3);
    color:#ef4444; font-size:22px; padding:12px 16px;
    border-radius:16px; display:none;
  }
  #btn-stop:active { transform:scale(0.93); }

  /* ── Splash / permission screen ── */
  #splash {
    position:absolute; inset:0;
    background:var(--bg);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:24px; padding:32px; text-align:center; z-index:20;
  }
  .splash-icon {
    width:90px; height:90px; border-radius:28px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    display:flex; align-items:center; justify-content:center;
    font-size:40px;
    box-shadow:0 0 40px var(--primary-glow);
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .splash-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; }
  .splash-desc { font-size:14px; color:var(--muted); line-height:1.6; max-width:280px; }
  #btn-allow {
    width:100%; max-width:300px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:white; border:none; border-radius:16px;
    padding:16px; font-size:15px; font-weight:700;
    cursor:pointer; box-shadow:0 4px 24px var(--primary-glow);
    transition:transform 0.15s ease;
  }
  #btn-allow:active { transform:scale(0.97); }

  /* ── Toast ── */
  #toast {
    position:fixed; bottom:110px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(15,21,35,0.95); border:1px solid var(--border);
    border-radius:14px; padding:10px 18px; font-size:13px;
    backdrop-filter:blur(12px); opacity:0; transition:all 0.3s ease;
    white-space:nowrap; z-index:100; pointer-events:none;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* FPS indicator */
  #fps-badge {
    position:absolute; top:14px; right:14px;
    background:rgba(0,0,0,0.6); border:1px solid rgba(99,102,241,0.3);
    border-radius:8px; padding:3px 8px; font-size:10px; font-weight:600;
    color:#6366f1; font-family:monospace; backdrop-filter:blur(4px);
    display:none;
  }

  /* ── No-camera placeholder ── */
  #nocam {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; color:var(--muted); font-size:14px; text-align:center;
    padding:24px;
  }
  #nocam span { font-size:48px; }
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div id="header">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      <div>
        <div class="logo-text">AutoSecure Vision</div>
        <div class="logo-sub">Mobile Camera</div>
      </div>
    </div>
    <div id="status-pill">
      <div class="pulse-dot" id="dot"></div>
      <span id="status-txt">Ready</span>
    </div>
  </div>

  <!-- Video area -->
  <div id="video-wrap">
    <video id="cam-video" autoplay playsinline muted></video>
    <canvas id="cap-canvas" style="display:none"></canvas>

    <!-- Splash screen -->
    <div id="splash">
      <div class="splash-icon">📱</div>
      <div class="splash-title">Connect Your Camera</div>
      <div class="splash-desc">
        Tap the button below to allow camera access and start streaming live video to your security dashboard.
      </div>
      <button id="btn-allow" onclick="startCamera()">
        🎬 Allow Camera Access
      </button>
    </div>

    <!-- HUD overlays (shown during streaming) -->
    <div id="hud" style="display:none">
      <div id="scan-line"></div>
      <div class="corner-tl"></div>
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>
      <div id="fps-badge" id="fps-badge">-- fps</div>
      <div id="stats-bar">
        <div class="stat-chip">
          <div class="stat-val" id="stat-frames">0</div>
          <div class="stat-lbl">Frames</div>
        </div>
        <div class="stat-chip">
          <div class="stat-val" id="stat-fps">--</div>
          <div class="stat-lbl">FPS</div>
        </div>
        <div class="stat-chip">
          <div class="stat-val" id="stat-kb">0</div>
          <div class="stat-lbl">KB/s</div>
        </div>
      </div>
    </div>

    <!-- No camera placeholder -->
    <div id="nocam" style="display:none">
      <span>📷</span>
      <p>Camera not available.<br>Please allow camera access.</p>
    </div>
  </div>

  <!-- Bottom controls -->
  <div id="controls">
    <button id="btn-flip" onclick="flipCamera()" title="Flip camera">🔄</button>
    <button id="btn-start" onclick="beginStreaming()">
      🎯 Start Streaming
    </button>
    <button id="btn-stop" onclick="stopStreaming()" title="Stop">⏹</button>
  </div>
</div>

<div id="toast"></div>

<script>
  const SESSION_TOKEN = "{{ token }}";
  const FRAME_INTERVAL_MS = 100; // 10 fps target
  const JPEG_QUALITY = 0.55;

  let stream = null;
  let streaming = false;
  let frameTimer = null;
  let frameCount = 0;
  let bytesSent = 0;
  let lastFpsTime = Date.now();
  let fpsFrames = 0;
  let facingMode = 'environment'; // Start with rear camera
  let statsTimer = null;

  const video   = document.getElementById('cam-video');
  const canvas  = document.getElementById('cap-canvas');
  const ctx     = canvas.getContext('2d');
  const splash  = document.getElementById('splash');
  const hud     = document.getElementById('hud');
  const nocam   = document.getElementById('nocam');
  const pill    = document.getElementById('status-pill');
  const dot     = document.getElementById('dot');
  const stTxt   = document.getElementById('status-txt');
  const btnStart = document.getElementById('btn-start');
  const btnStop  = document.getElementById('btn-stop');
  const fpsBadge = document.getElementById('fps-badge');

  function setStatus(state, text) {
    pill.className = 'connecting connecting'; // reset
    pill.classList.remove('connecting','streaming','error');
    if (state) pill.classList.add(state);
    stTxt.textContent = text;
    dot.classList.toggle('animate', state !== '');
  }

  function toast(msg, ms = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), ms);
  }

  async function startCamera() {
    setStatus('connecting', 'Requesting...');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 640 },
          height: { ideal: 480 },
          frameRate: { ideal: 15, max: 30 }
        },
        audio: false
      });
      video.srcObject = stream;
      video.classList.toggle('environment', facingMode === 'environment');
      video.style.display = 'block';
      splash.style.display = 'none';
      setStatus('connecting', 'Camera Ready');
      btnStart.disabled = false;
      toast('📷 Camera ready! Tap Start Streaming.');
    } catch (err) {
      console.error('Camera error:', err);
      splash.style.display = 'none';
      nocam.style.display = 'flex';
      setStatus('error', 'Camera Denied');
      toast('❌ Camera access denied. Please allow in browser settings.');
    }
  }

  async function flipCamera() {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    const wasStreaming = streaming;
    if (streaming) stopStreaming(true); // silent stop
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });
      video.srcObject = stream;
      video.classList.toggle('environment', facingMode === 'environment');
      if (wasStreaming) beginStreaming();
      toast(facingMode === 'environment' ? '📷 Rear camera' : '🤳 Front camera');
    } catch (e) {
      toast('❌ Could not switch camera');
    }
  }

  function beginStreaming() {
    if (!stream) { toast('⚠️ Start camera first'); return; }
    if (streaming) return;
    streaming = true;
    btnStart.style.display = 'none';
    btnStop.style.display = 'flex';
    hud.style.display = 'flex';
    fpsBadge.style.display = 'block';
    setStatus('streaming', 'LIVE');

    // Notify backend that mobile is connected
    fetch(`/api/mobile_cam/status_update/${SESSION_TOKEN}/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ connected: true })
    }).catch(() => {});

    frameTimer = setInterval(captureAndSend, FRAME_INTERVAL_MS);
    statsTimer = setInterval(updateStats, 1000);
    toast('🟢 Streaming started!');
  }

  function stopStreaming(silent = false) {
    if (!streaming) return;
    streaming = false;
    clearInterval(frameTimer);
    clearInterval(statsTimer);
    frameTimer = null;
    statsTimer = null;
    btnStart.style.display = 'flex';
    btnStop.style.display = 'none';
    hud.style.display = 'none';
    fpsBadge.style.display = 'none';
    setStatus('connecting', 'Stopped');
    // Notify backend
    fetch(`/api/mobile_cam/status_update/${SESSION_TOKEN}/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ connected: false })
    }).catch(() => {});
    if (!silent) toast('⏹ Streaming stopped.');
  }

  async function captureAndSend() {
    if (!streaming || !stream || video.readyState < 2) return;

    // Draw video frame to canvas
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(async (blob) => {
      if (!blob || !streaming) return;
      try {
        const res = await fetch(`/api/mobile_cam/frame/${SESSION_TOKEN}/`, {
          method: 'POST',
          headers: { 'Content-Type': 'image/jpeg' },
          body: blob
        });
        if (res.ok) {
          frameCount++;
          fpsFrames++;
          bytesSent += blob.size;
          document.getElementById('stat-frames').textContent = frameCount;
        }
      } catch (e) {
        // Network hiccup — keep trying
      }
    }, 'image/jpeg', JPEG_QUALITY);
  }

  function updateStats() {
    const now = Date.now();
    const elapsed = (now - lastFpsTime) / 1000;
    const fps = Math.round(fpsFrames / elapsed);
    const kbps = Math.round(bytesSent / 1024 / elapsed);

    document.getElementById('stat-fps').textContent = fps;
    document.getElementById('stat-kb').textContent = kbps;
    fpsBadge.textContent = fps + ' fps';

    fpsFrames = 0;
    bytesSent = 0;
    lastFpsTime = now;
  }

  // Keep screen awake via Wake Lock API
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        await navigator.wakeLock.request('screen');
      }
    } catch (e) { /* not supported */ }
  }
  requestWakeLock();

  // Handle page visibility (re-acquire wake lock)
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) requestWakeLock();
  });

  // Auto-start if already have permission (revisit)
  navigator.permissions?.query({ name: 'camera' }).then(result => {
    if (result.state === 'granted') startCamera();
  }).catch(() => {});
</script>
</body>
</html>
